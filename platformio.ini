; ============================================================================
;  GIF Display - LILYGO / TTGO T-Display ESP32 (1.14" 135x240, ST7789)
; ============================================================================
;  Build:        pio run
;  Upload fw:    pio run -t upload
;  Upload GIFs:  pio run -t uploadfs   (envia tudo de ./data para a flash)
;  Monitor:      pio device monitor
; ============================================================================

[platformio]
default_envs = ttgo-t-display

[env:ttgo-t-display]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600
; Nao mexer em DTR/RTS ao abrir o monitor (senao a placa cai em modo download)
monitor_rts   = 0
monitor_dtr   = 0

; Placa de 16MB: particao custom (2x app de 3MB + ~9.8MB de LittleFS)
board_upload.flash_size = 16MB
board_build.flash_size  = 16MB
board_build.partitions  = partitions_16mb.csv

; LittleFS para guardar os GIFs na flash interna
board_build.filesystem = littlefs

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bitbank2/AnimatedGIF @ ^2.1.1
    tzapu/WiFiManager @ ^2.0.17

; ----------------------------------------------------------------------------
;  Configuracao do TFT_eSPI feita via build_flags (NAO editar User_Setup.h).
;  Pinagem oficial da TTGO T-Display.
; ----------------------------------------------------------------------------
build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DCGRAM_OFFSET=1
    -DTFT_MISO=-1
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=6000000
