
name: Build TTGO GIF Display

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e ttgo-t-display

      - name: Save BIN file
        uses: actions/upload-artifact@v4
        with:
          name: ttgo-gif-display-firmware
          path: .pio/build/ttgo-t-display/firmware.bin
          if-no-files-found: error
