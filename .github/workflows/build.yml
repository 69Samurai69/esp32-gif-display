name: Build TTGO GIF Display

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build tools
        run: pip install platformio esptool

      - name: Build firmware
        run: pio run -e ttgo-t-display

      - name: Merge complete firmware image
        shell: bash
        run: |
          BUILD=".pio/build/ttgo-t-display"
          BOOT_APP0="$(find ~/.platformio/packages -name boot_app0.bin | head -n 1)"
          test -f "$BUILD/bootloader.bin"
          test -f "$BUILD/partitions.bin"
          test -f "$BUILD/firmware.bin"
          test -f "$BOOT_APP0"
          python -m esptool --chip esp32 merge_bin \
            -o "$BUILD/merged.bin" \
            --flash_mode dio \
            --flash_size 16MB \
            0x1000 "$BUILD/bootloader.bin" \
            0x8000 "$BUILD/partitions.bin" \
            0xe000 "$BOOT_APP0" \
            0x10000 "$BUILD/firmware.bin"

      - name: Upload merged firmware
        uses: actions/upload-artifact@v4
        with:
          name: ttgo-gif-display-merged
          path: .pio/build/ttgo-t-display/merged.bin
          if-no-files-found: error
